#-----------------------------------------------------------------------------------------------------------------------
# Security settings
#-----------------------------------------------------------------------------------------------------------------------
security:
  production-mode: false


#-----------------------------------------------------------------------------------------------------------------------
# Admin settings
#-----------------------------------------------------------------------------------------------------------------------
admin:
  keystore-admin-enabled: true

#-----------------------------------------------------------------------------------------------------------------------
# datasource postgres
#-----------------------------------------------------------------------------------------------------------------------
datasource:
  demodb:
    db-type: postgresql
    host: 192.168.128.150
    db-name: testdb
    username: dbo
    password: dbo
    ddl-auto: none

